<style>
:root{
  --amber:#ff7a18;
  --amber-2:#ffb347;
  --ink:#f3ece3;
  --dim:#b6a99a;
  --card:rgba(20,14,10,.42);
  --line:rgba(255,150,70,.22);
  --glow:rgba(255,122,24,.55);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:#07050a;color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}

/* ---------- background layers ---------- */
#bgvideo,#embers,#bgtint{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#bgvideo{object-fit:cover;opacity:0;transition:opacity .8s ease}
#bgvideo.on{opacity:.55}
#embers{z-index:1}
#bgtint{z-index:2;pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 30%,transparent 0%,rgba(7,5,10,.35) 60%,rgba(5,3,7,.85) 100%),
    radial-gradient(90% 60% at 50% 120%,rgba(255,90,20,.14),transparent 60%);}

/* ---------- enter gate ---------- */
#gate{position:fixed;inset:0;z-index:40;display:grid;place-items:center;cursor:pointer;
  background:rgba(4,3,6,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  transition:opacity .6s ease,visibility .6s}
#gate.hide{opacity:0;visibility:hidden}
#gate .enter{font-weight:700;letter-spacing:.28em;text-transform:uppercase;font-size:.9rem;color:var(--dim);
  padding:16px 26px;border:1px solid var(--line);border-radius:999px;
  box-shadow:0 0 44px rgba(255,122,24,.18) inset,0 0 30px rgba(0,0,0,.4);
  animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{50%{color:var(--ink);box-shadow:0 0 70px rgba(255,122,24,.3) inset,0 0 40px rgba(0,0,0,.5)}}

/* ---------- card ---------- */
.stage{position:fixed;inset:0;z-index:20;display:grid;place-items:center;padding:24px;perspective:1000px}
.card{
  position:relative;width:min(540px,92vw);
  background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:34px 30px 26px;
  backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);
  box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset,0 0 60px rgba(255,100,20,.08) inset;
  transform-style:preserve-3d;transition:transform .15s ease;
  opacity:0;translate:0 14px;animation:rise .9s cubic-bezier(.2,.8,.2,1) .15s forwards}
@keyframes rise{to{opacity:1;translate:0 0}}
.card::before{content:"";position:absolute;inset:-1px;border-radius:22px;padding:1px;pointer-events:none;
  background:linear-gradient(140deg,rgba(255,170,80,.5),transparent 40%,transparent 60%,rgba(255,120,30,.35));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}

.avatar{width:104px;height:104px;border-radius:50%;margin:0 auto 14px;display:block;
  border:2px solid rgba(255,160,80,.55);object-fit:cover;background:#140d08;
  box-shadow:0 0 0 5px rgba(255,120,30,.08),0 10px 30px rgba(0,0,0,.5)}
.name{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;
  font-weight:800;font-size:2rem;letter-spacing:.01em}
.name .badges{display:inline-flex;gap:6px}
.badge{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;
  background:rgba(255,140,50,.14);border:1px solid var(--line);font-size:.9rem}
.tag{margin:6px 0 0;text-align:center;color:var(--dim);font-size:1rem}
.rule{height:1px;margin:20px 2px;background:linear-gradient(90deg,transparent,var(--line),transparent)}

/* socials */
.socials{display:flex;flex-wrap:wrap;justify-content:center;gap:12px}
.soc{width:46px;height:46px;display:grid;place-items:center;border-radius:12px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);color:var(--dim);
  transition:transform .15s ease,color .15s ease,border-color .15s ease,background .15s ease}
.soc:hover{transform:translateY(-3px);color:#fff;border-color:var(--line);background:rgba(255,120,30,.12);
  box-shadow:0 8px 24px rgba(255,100,20,.18)}
.soc svg{width:20px;height:20px}

/* projects */
.sect-title{margin:0 0 10px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);text-align:center}
.projects{display:grid;gap:10px}
.proj{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
  transition:transform .15s ease,border-color .15s ease,background .15s ease}
.proj:hover{transform:translateY(-2px);border-color:var(--line);background:rgba(255,120,30,.1)}
.proj .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;
  background:linear-gradient(140deg,#ff7a18,#b5410a);color:#180a02;font-weight:800;font-size:1rem}
.proj .meta{min-width:0}
.proj .meta b{display:block;font-size:1.02rem;font-weight:700;letter-spacing:.01em}
.proj .meta > span{display:block;color:var(--dim);font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.proj .go{margin-left:auto;color:var(--dim);flex:0 0 auto;transition:transform .15s ease,color .15s ease}
.proj:hover .go{color:#fff;transform:translate(2px,-2px)}
.proj .ic.logo{background:#140d08;overflow:hidden;padding:0}
.proj .ic.logo img{width:100%;height:100%;object-fit:cover;display:block}
.proj-group{display:grid;gap:8px}
.proj-socials{display:flex;gap:8px;padding:2px 2px 2px 52px}
.proj-socials .soc.sm{width:36px;height:36px;border-radius:10px}
.proj-socials .soc.sm svg{width:17px;height:17px}
@media (max-width:420px){.proj-socials{padding-left:0;justify-content:center}}

/* footer row */
.foot{display:flex;align-items:center;justify-content:space-between;margin-top:22px;color:var(--dim);font-size:.85rem}
.views{display:inline-flex;align-items:center;gap:7px}
.views svg{width:16px;height:16px;opacity:.8}
.mute{display:inline-flex;align-items:center;gap:7px;cursor:pointer;padding:6px 10px;border-radius:999px;
  border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03)}
.mute:hover{border-color:var(--line);color:#fff}

.site-foot{position:fixed;left:0;right:0;bottom:0;z-index:30;text-align:center;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px));
  font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);opacity:.78;pointer-events:none}
.site-foot b{color:var(--amber-2);font-weight:700;letter-spacing:.14em}

@media (max-width:420px){.card{padding:26px 20px 20px}.name{font-size:1.7rem}.avatar{width:92px;height:92px}}
</style>

<script>
(() => {
  const $ = s => document.querySelector(s);

  /* ---- ember / rust heat background ---- */
  const cv = $("#embers"), ctx = cv.getContext("2d");
  let W, H, DPR, parts = [];
  function resize(){
    DPR = Math.min(devicePixelRatio||1, 2);
    W = cv.width = innerWidth*DPR; H = cv.height = innerHeight*DPR;
    cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px";
    const target = Math.round(innerWidth*innerHeight/14000);
    parts = Array.from({length: target}, mk);
  }
  function mk(){
    return {
      x: Math.random()*W, y: H + Math.random()*H,
      r: (Math.random()*2+0.6)*DPR,
      v: (Math.random()*0.5+0.25)*DPR,
      drift: (Math.random()-0.5)*0.4*DPR,
      a: Math.random()*0.5+0.25,
      hue: 18 + Math.random()*22,
      tw: Math.random()*Math.PI*2
    };
  }
  function frame(){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = "lighter";
    for(const p of parts){
      p.y -= p.v; p.x += p.drift + Math.sin(p.y*0.01+p.tw)*0.2*DPR; p.tw += 0.02;
      if(p.y < -10){ Object.assign(p, mk()); p.y = H+10; }
      const fl = p.a * (0.6 + 0.4*Math.sin(p.tw*3));
      const g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r*6);
      g.addColorStop(0, `hsla(${p.hue},100%,62%,${fl})`);
      g.addColorStop(1, `hsla(${p.hue},100%,50%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r*6,0,7); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(frame);
  }
  addEventListener("resize", resize); resize(); frame();

  /* ---- card tilt ---- */
  const card = $("#card");
  addEventListener("mousemove", e => {
    const r = card.getBoundingClientRect();
    const dx = (e.clientX-(r.left+r.width/2))/r.width;
    const dy = (e.clientY-(r.top+r.height/2))/r.height;
    card.style.transform = `rotateY(${dx*6}deg) rotateX(${-dy*6}deg)`;
  });
  addEventListener("mouseleave", ()=> card.style.transform="");

  /* ---- enter gate: start video + optional music on first interaction ---- */
  const gate = $("#gate"), vid = $("#bgvideo"), bgm = $("#bgm"), mute = $("#mute");
  vid.addEventListener("loadeddata", ()=> vid.classList.add("on"));
  let soundOn = false;
  function enter(){
    gate.classList.add("hide");
    vid.play().catch(()=>{});
    bgm.volume = 0.12;
    bgm.play().then(()=>{ soundOn = true; mute.innerHTML = "🔊 <span>sound on</span>"; }).catch(()=>{});
    loadViews(true);
  }
  gate.addEventListener("click", enter, {once:true});
  mute.addEventListener("click", () => {
    soundOn = !soundOn;
    if(soundOn){ bgm.volume = 0.12; bgm.play().then(()=>{ mute.innerHTML="🔊 <span>sound on</span>"; }).catch(()=>{ soundOn=false; }); }
    else { bgm.pause(); mute.innerHTML="🔇 <span>sound off</span>"; }
  });

  /* ---- view counter: real, shared count served from the VPS (CORS) ---- */
  const VIEWS_URL = "https://www.onegridrust.com/sn1p-views.php";
  async function loadViews(increment){
    try{
      const r = await fetch(VIEWS_URL, {method: increment ? "POST" : "GET", cache:"no-store"});
      if(r.ok){ const j = await r.json(); if(typeof j.views === "number"){ animateCount(j.views); return; } }
    }catch(e){}
    animateCount(0);
  }
  function animateCount(target){
    const el = $("#views"); const start = Math.max(0, target-60), t0 = performance.now();
    (function step(t){
      const k = Math.min(1,(t-t0)/800);
      el.textContent = Math.round(start + (target-start)*(1-Math.pow(1-k,3))).toLocaleString();
      if(k<1) requestAnimationFrame(step); else el.textContent = target.toLocaleString();
    })(t0);
  }
  // the count is fetched + incremented when the visitor clicks enter
})();
</script>
</body>
